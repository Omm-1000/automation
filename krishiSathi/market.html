<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KrishiSathi — Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { primary: { 600: '#0da553', 700: '#0b8245' } }, fontFamily: { sans: ['Inter','system-ui'] } } } };
    </script>
  </head>
  <body class="font-sans bg-white text-slate-800">
    <header class="sticky top-0 z-40 backdrop-blur bg-white/80 border-b border-slate-200">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <a href="/workspace/krishiSathi/index.html" class="flex items-center gap-2"><span class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-primary-600 text-white font-bold">KS</span><span class="text-lg font-extrabold">KrishiSathi</span></a>
        <nav class="hidden md:flex items-center gap-6 text-sm font-medium">
          <a class="text-primary-700" href="/workspace/krishiSathi/market.html">Marketplace</a>
          <a class="hover:text-primary-700" href="/workspace/krishiSathi/farmer.html">Farmer Portal</a>
        </nav>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="flex flex-wrap items-end gap-4">
        <div class="grow">
          <h1 class="text-2xl font-extrabold">Fresh produce marketplace</h1>
          <p class="text-slate-600">Buy directly from farmers near you.</p>
        </div>
        <a href="/workspace/krishiSathi/farmer.html" class="inline-flex items-center rounded-lg bg-primary-600 text-white px-4 py-2 font-semibold shadow hover:bg-primary-700">Post your produce</a>
      </div>

      <div class="mt-6 grid md:grid-cols-4 gap-4">
        <div class="col-span-3">
          <div id="marketGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
        <aside class="md:col-span-1 space-y-3">
          <div class="rounded-xl border border-slate-200 p-4">
            <div class="text-sm font-semibold">Filters</div>
            <div class="mt-3 space-y-3">
              <div>
                <label class="block text-sm">Category</label>
                <select id="filterCategory" class="mt-1 w-full rounded-lg border-slate-300 focus:ring-primary-600 focus:border-primary-600">
                  <option value="">All</option>
                  <option>Vegetables</option>
                  <option>Fruits</option>
                  <option>Grains</option>
                  <option>Dairy</option>
                  <option>Other</option>
                </select>
              </div>
              <div>
                <label class="block text-sm">Max price (₹)</label>
                <input id="filterMaxPrice" type="number" min="0" step="1" class="mt-1 w-full rounded-lg border-slate-300 focus:ring-primary-600 focus:border-primary-600" placeholder="100" />
              </div>
              <div>
                <label class="block text-sm">Search</label>
                <input id="filterSearch" type="text" class="mt-1 w-full rounded-lg border-slate-300 focus:ring-primary-600 focus:border-primary-600" placeholder="e.g. tomato" />
              </div>
              <button id="applyFilters" class="w-full inline-flex items-center justify-center rounded-lg bg-primary-600 text-white px-4 py-2 font-semibold hover:bg-primary-700">Apply</button>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <!-- Product modal -->
    <div id="productModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
      <div class="absolute inset-0 bg-black/50"></div>
      <div class="relative bg-white rounded-2xl shadow-xl max-w-2xl w-full overflow-hidden">
        <div class="grid md:grid-cols-2">
          <img id="modalImage" src="" alt="" class="h-60 md:h-full w-full object-cover" />
          <div class="p-6">
            <div class="flex justify-between items-start gap-4">
              <h3 id="modalName" class="text-xl font-bold"></h3>
              <button id="modalClose" class="text-slate-500 hover:text-slate-700">✕</button>
            </div>
            <div class="mt-1 text-primary-700 font-semibold" id="modalPrice"></div>
            <div class="mt-2 text-sm text-slate-700" id="modalDescription"></div>
            <div class="mt-4 text-sm" id="modalMeta"></div>
            <div class="mt-6 flex gap-3">
              <a id="modalCall" target="_blank" class="inline-flex items-center rounded-lg bg-primary-600 text-white px-4 py-2 font-semibold hover:bg-primary-700">Call</a>
              <a id="modalWhatsapp" target="_blank" class="inline-flex items-center rounded-lg border border-slate-300 px-4 py-2 font-semibold hover:border-slate-400">WhatsApp</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer class="border-t border-slate-200 py-8 text-sm text-center text-slate-600">© <span id="year"></span> KrishiSathi</footer>

    <script src="/workspace/krishiSathi/js/app.js"></script>
    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
      window.addEventListener('DOMContentLoaded', function(){
        KrishiSathiUI.initMarketPage();
      });
    </script>
  </body>
</html>
